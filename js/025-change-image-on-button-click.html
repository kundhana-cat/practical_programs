<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Image on Button Click</title><style>body{font-family:Arial;margin:0;padding:24px;background:#f4f6fb}main{max-width:950px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 25px #0001}button,input,select,textarea{padding:10px;margin:5px;border:1px solid #ccc;border-radius:8px}button{background:#111827;color:white;cursor:pointer}.card{padding:15px;margin:10px 0;background:#f8fafc;border-radius:10px}pre{white-space:pre-wrap}img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body><main><img id="pic" src="https://picsum.photos/id/1015/600/300"><br><button onclick="run()">Change Image</button><script>function run(){pic.src='https://picsum.photos/id/1025/600/300'}</script></main></body></html>
