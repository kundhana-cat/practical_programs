<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch API</title><style>body{font-family:Arial;margin:0;padding:24px;background:#f4f6fb}main{max-width:950px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 25px #0001}button,input,select,textarea{padding:10px;margin:5px;border:1px solid #ccc;border-radius:8px}button{background:#111827;color:white;cursor:pointer}.card{padding:15px;margin:10px 0;background:#f8fafc;border-radius:10px}pre{white-space:pre-wrap}img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body><main><h1>Fetch API</h1><input id="a" value="10"><input id="b" value="5"><button onclick="run()">Run</button><pre id="out"></pre><script>function callback(f){setTimeout(()=>f('Callback complete'),200)}async function run(){callback(x=>out.textContent=x);let x=await new Promise(r=>setTimeout(()=>r('Promise complete'),500));out.textContent+='\n'+x}</script></main></body></html>
