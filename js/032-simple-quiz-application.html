<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Quiz Application</title><style>body{font-family:Arial;margin:0;padding:24px;background:#f4f6fb}main{max-width:950px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 25px #0001}button,input,select,textarea{padding:10px;margin:5px;border:1px solid #ccc;border-radius:8px}button{background:#111827;color:white;cursor:pointer}.card{padding:15px;margin:10px 0;background:#f8fafc;border-radius:10px}pre{white-space:pre-wrap}img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body><main><h1>To-Do List</h1><input id="task"><button onclick="add()">Add</button><ul id="list"></ul><script>function add(){if(!task.value.trim())return;let li=document.createElement('li');li.innerHTML=task.value+' <button onclick="this.parentElement.remove()">Delete</button>';list.appendChild(li);task.value=''}</script></main></body></html>
