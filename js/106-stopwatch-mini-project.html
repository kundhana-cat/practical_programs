<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch Mini Project</title><style>body{font-family:Arial;margin:0;padding:24px;background:#f4f6fb}main{max-width:950px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 25px #0001}button,input,select,textarea{padding:10px;margin:5px;border:1px solid #ccc;border-radius:8px}button{background:#111827;color:white;cursor:pointer}.card{padding:15px;margin:10px 0;background:#f8fafc;border-radius:10px}pre{white-space:pre-wrap}img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body><main><h1>Stopwatch</h1><div id="time" style="font-size:45px">0</div><button onclick="start()">Start</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button><script>let n=0,id;function start(){if(!id)id=setInterval(()=>time.textContent=++n,1000)}function stop(){clearInterval(id);id=null}function reset(){stop();n=0;time.textContent=0}</script></main></body></html>
