<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 Responsive Media Queries</title>
</head>
<body>
<h1>Responsive Layout</h1><div class="cards"><div>One</div><div>Two</div><div>Three</div></div><style>.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.cards div{padding:40px;background:#eef2ff}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style>
</body>
