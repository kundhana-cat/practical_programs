<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>58 Grid Template Areas</title>
</head>
<body>
<div class="layout"><header>Header</header><aside>Sidebar</aside><main>Main</main><footer>Footer</footer></div><style>.layout{display:grid;grid-template-areas:'header header' 'side main' 'footer footer';grid-template-columns:220px 1fr;gap:10px}.layout>*{padding:30px;background:#eef2ff}.layout header{grid-area:header}.layout aside{grid-area:side}.layout main{grid-area:main}.layout footer{grid-area:footer}</style>
</body>
</html>
