<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 Positioning</title>
</head>
<body>
<div class="area"><span class="static">Static</span><span class="relative">Relative</span><span class="absolute">Absolute</span></div><div class="fixed">Fixed</div><style>.area{height:250px;position:relative;background:#eef2ff}.static,.relative,.absolute{padding:15px;background:white}.relative{position:relative;left:40px}.absolute{position:absolute;right:20px;bottom:20px}.fixed{position:fixed;right:20px;top:20px;background:#6d5dfc;color:white;padding:15px}.area:after{content:'Sticky demo';position:sticky;top:0;background:#16c7b7;padding:10px;display:block}</style>
</body>
</html>
