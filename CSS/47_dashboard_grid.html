<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>46 Dashboard Grid</title>
</head>
<body>
<div class="dashboard"><header>Header</header><aside>Sidebar</aside><main>Main</main><footer>Footer</footer></div><style>.dashboard{display:grid;grid-template-columns:220px 1fr;grid-template-rows:80px 1fr 60px;min-height:500px;gap:10px}.dashboard>*{padding:25px;background:#eef2ff}.dashboard header,.dashboard footer{grid-column:1/3}</style>
</body>
</html>
