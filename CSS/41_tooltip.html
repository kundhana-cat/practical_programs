<body>
<span class="tip">Hover me<span class="tooltip">This is a tooltip.</span></span><style>.tip{position:relative;background:#111827;color:white;padding:15px}.tooltip{display:none;position:absolute;bottom:130%;left:0;background:#6d5dfc;padding:10px;width:160px}.tip:hover .tooltip{display:block}</style>
