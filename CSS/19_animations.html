<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>19 Animations</title>
</head>
<body>
<div class="box"></div><style>.box{width:100px;height:100px;background:#6d5dfc;border-radius:20px;animation:move 2s infinite alternate}@keyframes move{to{transform:translateX(300px) rotate(180deg);border-radius:50%}}</style>
</body>
